name: Controlled safety gate

on:
  push:
  pull_request:

jobs:
  controlled-state:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate controlled JSON
        shell: powershell
        run: |
          Get-Content .controlled\reverse-skill-policy.json -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
          Get-Content .controlled\upstream-lock.json -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
          Get-Content .controlled\model-routing.json -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
          Get-Content .controlled\work-order.schema.json -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null
      - name: Verify audited upstream surface did not drift
        shell: powershell
        run: .\scripts\verify-controlled-state.ps1
      - name: Verify risk, routing, and execution contract
        shell: powershell
        run: .\scripts\test-risk-routing-contract.ps1
      - name: Verify nested Windows PowerShell invocation
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-controlled-state.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-risk-routing-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $skillRoot = Join-Path $env:RUNNER_TEMP 'reverse-skill-test-skills'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\install-reverse-triage.ps1 -SkillRoot $skillRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installed = Join-Path $skillRoot 'reverse-triage\SKILL.md'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
            throw "Nested installer did not create expected skill: $installed"
          }
